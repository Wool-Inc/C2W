name: c2w
version: '${version}'

main: net.klaaswhite.c2w.bootstrap.C2W
api-version: '26.1'

commands:
  c2w:
    description: c2w game commands
  marker:
    description: Create, remove and list markers
  world:
    description: Teleport between plugin-managed worlds
  structure:
    description: Manage structures (create, edit, define, save)
    usage: /structure <subcommand>
    permission: c2w.admin
  layout:
    description: Layout editor — place structures and save map layouts
    usage: /layout <subcommand>
    permission: c2w.admin

depend:
  [ProtocolLib]
